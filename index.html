<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDO | Creative Digital Studio</title>
  <meta name="description" content="Animated creative digital studio website with CDO center logo and motion effects." />
  <style>
    :root {
      --bg: #050816;
      --bg-2: #0b1120;
      --panel: rgba(17, 24, 39, 0.72);
      --panel-strong: rgba(15, 23, 42, 0.96);
      --text: #e5eefc;
      --muted: #9bb0d0;
      --primary: #7c3aed;
      --secondary: #18d4ff;
      --accent: #ff4ecd;
      --line: rgba(255,255,255,0.12);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124,58,237,0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(24,212,255,0.18), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      overflow-x: hidden;
    }

    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: rgba(5, 8, 22, 0.18);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 78px;
    }

    .brand {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(124,58,237,0.35), rgba(24,212,255,0.08));
      box-shadow: 0 0 18px rgba(124,58,237,0.5);
    }

    .brand-mark::before {
      content: "CD";
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .nav-menu {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-menu a {
      color: rgba(255,255,255,0.82);
      font-size: 0.96rem;
      transition: 0.3s ease;
      position: relative;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
      transition: 0.3s ease;
    }

    .nav-menu a:hover { color: #fff; }
    .nav-menu a:hover::after { width: 100%; }

    .nav-cta {
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: linear-gradient(135deg, rgba(124,58,237,0.30), rgba(24,212,255,0.12));
      font-weight: 700;
      letter-spacing: 0.06em;
      transition: 0.3s ease;
    }

    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124,58,237,0.4);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 90px;
      overflow: hidden;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.24;
      filter: brightness(0.8) saturate(1.3);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(5,8,22,0.82), rgba(5,8,22,0.38), rgba(5,8,22,0.76)),
        radial-gradient(circle at center, transparent 30%, rgba(5,8,22,0.7) 100%);
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 30px;
      align-items: center;
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero-copy {
      animation: fadeUp 1s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--secondary);
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .eyebrow::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 12px var(--secondary);
    }

    h1 {
      margin: 24px 0 20px;
      font-size: clamp(2.8rem, 5vw, 6rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    .highlight {
      color: transparent;
      background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero-copy p {
      margin: 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 24px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: 0.3s ease;
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 20px 40px rgba(124,58,237,0.35);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.02);
      color: #fff;
      border-color: rgba(255,255,255,0.12);
    }
