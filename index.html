<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDO | Sheikh & Sahil Explorer</title>

  <style>
    /* CSS Variables for Unique Color Scheme */
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --accent-yellow: #facc15;
      --accent-gold: #eab308;
      --accent-emerald: #10b981;
      --accent-indigo: #6366f1;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header Layout */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(250, 204, 21, 0.2);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Top Center CDO Logo */
    .header-logo-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
    }

    .cdo-logo {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2.5px solid var(--accent-yellow);
      border-radius: 50px;
      padding: 0.4rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
      transition: transform 0.3s ease;
    }

    .cdo-logo:hover {
      transform: scale(1.05);
    }

    .cdo-text {
      color: var(--accent-yellow);
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px rgba(250, 204, 21, 0.4);
    }

    /* Top Right 3-Line Menu Button */
    .menu-toggle {
      background: transparent;
      border: none;
      color: var(--accent-yellow);
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .menu-toggle:hover {
      background: rgba(250, 204, 21, 0.1);
    }

    /* Sliding Navigation Drawer */
    .nav-drawer {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100vh;
      background: #0f172a;
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.7);
      z-index: 200;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .nav-drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1rem;
    }

    .drawer-title {
      color: var(--accent-yellow);
      font-weight: 800;
      font-size: 1.2rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 1.8rem;
      cursor: pointer;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
